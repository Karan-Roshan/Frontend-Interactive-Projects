<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Technology Distribution</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="heading">
            <h1>Project Technology Distribution</h1>
        </div>
        <div class="distribution_container">
            <div class="skills" >
                <div class="skill_percent">
                    <div class="outer">
                        <div class="inner">
                            <div id="num1"></div>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160px" height="160px">
                        <defs>
                            <linearGradient id="GradientColor">
                                <stop offset="0%" stop-color="#e91e63" />
                                <stop offset="100%" stop-color="#673ab7" />
                            </linearGradient>
                        </defs>
                        <circle class="HTML_Circle" cx="90" cy="90" r="80" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="skill_title">HTML</div>
            </div>
            <div class="skills">
                <div class="skill_percent">
                    <div class="outer">
                        <div class="inner">
                            <div id="num2"></div>
                        </div>
                    </div>

                    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160px" height="160px">
                        <defs>
                            <linearGradient id="GradientColor">
                                <stop offset="0%" stop-color="#e91e63" />
                                <stop offset="100%" stop-color="#673ab7" />
                            </linearGradient>
                        </defs>
                        <circle class="CSS_Circle" cx="90" cy="90" r="80" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="skill_title">CSS</div>
            </div>
            <div class="skills">
                <div class="skill_percent">
                    <div class="outer">
                        <div class="inner">
                            <div id="num3"></div>
                        </div>
                    </div>

                    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="160px" height="160px">
                        <defs>
                            <linearGradient id="GradientColor">
                                <stop offset="0%" stop-color="#e91e63" />
                                <stop offset="100%" stop-color="#673ab7" />
                            </linearGradient>
                        </defs>
                        <circle class="JS_Circle" cx="90" cy="90" r="80" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="skill_title">JS</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
