<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Quiz</h1>
        
        <div class="quiz-box" id="start-screen">
            <h2 class="welcome-text">Welcome to Tech Quiz!</h2>
            <p class="instruction">Test your knowledge with 10 challenging questions</p>
            <button class="start-btn" id="start-btn">Start Quiz</button>
        </div>

        <div class="quiz-box" id="quiz-screen" style="display: none;">
            <h2 class="question"></h2>
            <div class="options"></div>
            <button class="next-btn">Next</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
